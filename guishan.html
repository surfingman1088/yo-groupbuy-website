<div class="wrap">

  <header>
    <img src="assets/landing/k-logo.webp" width="32" height="32" alt="K團購">

  <p class="subtitle">小農直送・一件免運・可退貨退款</p>

  <div class="spacer"></div>

  <div class="redirect-bar" id="redirect-bar">
    正在帶你前往社團⋯ <span class="count" id="countdown">1</span>
  </div>

  <a id="cta"
     class="cta-btn"
     href="https://www.facebook.com/groups/1561057388927848/"
     target="_top"
     rel="noopener">立即加入社團 →</a>

  <div id="iab-hint" class="iab-hint" hidden>
    <span class="iab-hint-icon">⋯</span>
    <span class="iab-hint-text">若沒有自動跳轉，請點右上角「⋯」選擇「在瀏覽器中開啟」</span>
  </div>

  <footer>K團購（悠冉企業社）｜統一編號 93000758</footer>

</div>

<script>
(function () {
  "use strict";

  var GROUP_URL = "https://www.facebook.com/groups/1561057388927848/";
  var params    = new URLSearchParams(window.location.search);
  var adSource  = params.get("ad") || "unknown";
  var ua        = navigator.userAgent;

  // ── 瀏覽器環境偵測 ──────────────────────────────────────
  var inApp       = false;
  var browserType = "other";

  if (/FBAN|FBAV|FB_IAB|FBIOS|FBDV/.test(ua)) {
    inApp = true; browserType = "facebook";
  } else if (/Instagram/.test(ua)) {
    inApp = true; browserType = "instagram";
  } else if (/Line\//.test(ua)) {
    inApp = true; browserType = "line";
  } else if (/\bOPR\/|\bEdgA?\/|SamsungBrowser/.test(ua)) {
    browserType = "other_app";
  }

  var deviceType = /Mobi|Android|iPhone|iPad|iPod/.test(ua) ? "mobile" : "desktop";
  var isAndroid  = /Android/.test(ua);

  var btn = document.getElementById("cta");

  // ── Android：優先用 intent:// 直接開 FB App，開不了就退回瀏覽器 ──
  // （iOS 的 Universal Links 在別的 App 內建瀏覽器裡本來就不會生效，
  //   蘋果平台限制，intent:// 是 Android 專屬語法，iOS 維持原本網址）
  if (isAndroid) {
    var withoutScheme = GROUP_URL.replace(/^https?:\/\//, "");
    var intentUrl = "intent://" + withoutScheme +
      "#Intent;scheme=https;package=com.facebook.katana;S.browser_fallback_url=" +
      encodeURIComponent(GROUP_URL) + ";end";
    btn.setAttribute("href", intentUrl);
  }

  // ── 非 Android 的 App 內建瀏覽器（iOS 上的 FB／IG／Line 等）：
  //   自動跳轉不一定能直接開 App，顯示手動開啟提示當退路 ──
  if (inApp && !isAndroid) {
    var hintEl = document.getElementById("iab-hint");
    if (hintEl) hintEl.hidden = false;
  }

  if (typeof fbq === "function") {
    fbq("trackCustom", "BrowserEnvironmentCheck", {
      in_app_browser: inApp,
      browser_type:   browserType,
      device_type:    deviceType,
      is_android:     isAndroid,
      ad_source:      adSource
    });
  }

  // ── JS 自動跳轉（1.2 秒後模擬點擊，讓 iOS 視為使用者手勢）──
  var redirected = false;
  function doRedirect() {
    if (redirected) return;
    redirected = true;
    fired = true;
    if (typeof fbq === "function") {
      fbq("trackCustom", "AutoRedirect", {
        ad_source:    adSource,
        browser_type: browserType
      });
    }
    btn.click();
  }
  setTimeout(doRedirect, 1200);

  // ── 倒數顯示 ─────────────────────────────────────────────
  var countEl = document.getElementById("countdown");
  var count   = 1;
  var ticker  = setInterval(function () {
    count--;
    if (countEl) countEl.textContent = count > 0 ? count : "🚀";
    if (count <= 0) clearInterval(ticker);
  }, 1000);

  // ── 按鈕點擊追蹤（讓 <a href> 原生導頁）─────────────────
  var fired = false;

  function onTap() {
    if (fired) return;
    fired = true;
    redirected = true;
    clearInterval(ticker);
    if (typeof fbq === "function") {
      fbq("trackCustom", "ClickJoinGroup", {
        ad_source:      adSource,
        browser_type:   browserType,
        in_app_browser: inApp
      });
    }
  }

  btn.addEventListener("touchend", onTap, { passive: true });
  btn.addEventListener("click",    onTap);
})();
</script>
